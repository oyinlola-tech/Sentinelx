name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sentinelx
          POSTGRES_PASSWORD: sentinelx-test
          POSTGRES_DB: sentinelx_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinelx"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libpcap0.8
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check packages apps tests scripts
          ruff format --check packages apps tests scripts
      - name: Mypy
        run: mypy
      - name: Tests (SQLite, PostgreSQL, Redis)
        env:
          SENTINELX_TEST_POSTGRES_URL: postgresql://sentinelx:sentinelx-test@127.0.0.1:5432/sentinelx_test
          SENTINELX_TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: python -m pytest --cov --cov-report=term-missing
      - name: Migrations match the models
        env:
          DATABASE_URL: postgresql://sentinelx:sentinelx-test@127.0.0.1:5432/sentinelx_ci_migrations
        run: |
          PGPASSWORD=sentinelx-test psql -h 127.0.0.1 -U sentinelx -d sentinelx_test \
            -c "CREATE DATABASE sentinelx_ci_migrations"
          sentinelx db upgrade
          alembic check
      - name: Rules validate and pass their embedded tests
        run: |
          sentinelx rules validate
          sentinelx rules test rules

  dashboard:
    name: Dashboard (lint, types, build, API contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Install
        run: |
          pip install -e .
          npm ci --prefix apps/dashboard
      - name: OpenAPI contract has not drifted
        run: |
          python scripts/export_openapi.py
          npm run --prefix apps/dashboard -s generate:api
          git diff --exit-code -- apps/dashboard/src/lib/openapi.json apps/dashboard/src/lib/api-schema.d.ts
      - name: Lint
        run: npm run --prefix apps/dashboard -s lint
      - name: Typecheck
        run: npm run --prefix apps/dashboard -s typecheck
      - name: Build
        run: npm run --prefix apps/dashboard -s build

  images:
    name: Container images build
    runs-on: ubuntu-latest
    needs: [backend, dashboard]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t sentinelx-api:ci .
      - name: Build dashboard image
        run: docker build -f docker/Dockerfile.dashboard -t sentinelx-dashboard:ci .
