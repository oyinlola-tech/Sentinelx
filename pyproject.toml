[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelx"
version = "0.1.0"
description = "SentinelX - an explainable network intrusion detection and prevention platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "SentinelX Contributors" }]
keywords = ["ids", "ips", "nidps", "network-security", "intrusion-detection"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "Topic :: Security",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0.29",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "aiosqlite>=0.20",
  "redis>=5.0",
  "typer>=0.12",
  "rich>=13.7",
  "structlog>=24.1",
  "scapy>=2.5",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "prometheus-client>=0.20",
  "pyjwt>=2.8",
  "argon2-cffi>=23.1",
  "psutil>=5.9",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "mypy>=1.9",
  "ruff>=0.4",
  "types-PyYAML",
]
pyshark = ["pyshark>=0.6"]

[project.scripts]
sentinelx = "sentinelx.cli.main:app"

[project.urls]
Homepage = "https://github.com/sentinelx/sentinelx"
Documentation = "https://github.com/sentinelx/sentinelx/tree/main/docs"

[tool.setuptools]
package-dir = { "" = "packages" }

[tool.setuptools.packages.find]
where = ["packages"]
include = ["sentinelx*"]

[tool.setuptools.package-data]
"sentinelx" = ["py.typed"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages", "apps", "tests"]
extend-exclude = [".venv", "apps/dashboard"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "B",         # bugbear
  "C4",        # comprehensions
  "UP",        # pyupgrade
  "S",         # bandit (security)
  "ASYNC",     # async correctness
  "RUF",       # ruff-specific
  "SIM",       # simplify
  "TID",       # tidy imports
  "PTH",       # pathlib
  "N",         # pep8-naming
]
ignore = [
  "E501",    # handled by the formatter
  "S104",    # binding 0.0.0.0 is a deliberate, documented container default
  "B008",    # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S311"]
"scripts/*" = ["S101", "S603", "S607"]
"packages/sentinelx/firewall/*" = ["S603"]  # argv-list subprocess, audited in module
# Test fixtures need *reproducible* randomness, which is the opposite of what a
# CSPRNG provides. No value from this module is ever used as a secret.
"packages/sentinelx/testing/*" = ["S311"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["sentinelx"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
mypy_path = "packages"
packages = ["sentinelx"]
strict = true
warn_unreachable = true
disallow_any_generics = true
show_error_codes = true
plugins = ["pydantic.mypy"]
# Generated Alembic revisions: checked by `alembic check` and the PostgreSQL tests instead.
exclude = ["packages/sentinelx/storage/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["scapy.*", "sklearn.*", "pyshark.*", "redis.*", "psutil.*", "joblib.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
markers = [
  "integration: requires external services (postgres/redis)",
  "root: requires root privileges (live capture / firewall)",
  "slow: long-running benchmark or replay test",
]
filterwarnings = ["error::DeprecationWarning:sentinelx.*"]

[tool.coverage.run]
source = ["packages/sentinelx"]
omit = ["*/__main__.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
