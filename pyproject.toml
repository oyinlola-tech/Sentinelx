[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelx"
version = "0.1.0"
description = "SentinelX - an explainable network intrusion detection and prevention platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Oluwayemi Oyinlola Michael" }]
keywords = ["ids", "ips", "nidps", "network-security", "intrusion-detection"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "Topic :: Security",
  "Programming Language :: Python :: 3.12",
]

# Upper bounds stop at the first release this code has not been verified against: newer
# minor releases of FastAPI, Starlette, Typer and Click have changed behaviour before.
# Verified: FastAPI 0.135 and 0.141, Starlette 1.3 and 1.6, Typer 0.20 and 0.27, Click 8.3
# and 8.5, Pydantic 2.13, SQLAlchemy 2.0.48 and 2.0.53, uvicorn 0.38 and 0.53. Raise a
# bound only after the suite passes on the new release (the scheduled "latest allowed"
# CI job installs the newest versions these ranges permit). Reproducible installs:
# pip install -e ".[dev,ml]" -c constraints.txt
dependencies = [
  "fastapi>=0.110,<0.142",
  "starlette<1.7",
  "uvicorn[standard]>=0.29,<0.54",
  "pydantic>=2.6,<2.14",
  "pydantic-settings>=2.2,<2.16",
  "python-dotenv>=1.2.2,<2",
  "sqlalchemy[asyncio]>=2.0.29,<2.1",
  "alembic>=1.13,<1.21",
  "asyncpg>=0.29,<0.32",
  "aiosqlite>=0.20,<0.23",
  "redis>=5.0,<9",
  "typer>=0.12,<0.28",
  "click<8.6",
  "rich>=13.7,<16",
  "structlog>=24.1,<27",
  "scapy>=2.5,<2.8",
  "pyyaml>=6.0,<7",
  "prometheus-client>=0.20,<0.27",
  "pyjwt>=2.8,<3",
  "argon2-cffi>=23.1,<26",
  "psutil>=5.9,<8",
  "httpx>=0.27,<0.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1,<10",
  "pytest-asyncio>=0.23,<2",
  "pytest-cov>=5.0,<8",
  "mypy>=1.9,<2.4",
  "ruff>=0.4,<0.17",
  "types-PyYAML",
]
ml = ["numpy>=1.26,<3", "scikit-learn>=1.4,<1.10"]

[project.scripts]
sentinelx = "sentinelx.cli.main:app"

[project.urls]
Homepage = "https://oyinlola1.vercel.app"

[tool.setuptools]
package-dir = { "" = "packages" }

[tool.setuptools.packages.find]
where = ["packages"]
include = ["sentinelx*"]

[tool.setuptools.package-data]
"sentinelx" = ["py.typed"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages", "apps", "tests"]
extend-exclude = [".venv", "apps/dashboard"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "B",         # bugbear
  "C4",        # comprehensions
  "UP",        # pyupgrade
  "S",         # bandit (security)
  "ASYNC",     # async correctness
  "RUF",       # ruff-specific
  "SIM",       # simplify
  "TID",       # tidy imports
  "PTH",       # pathlib
  "N",         # pep8-naming
]
ignore = [
  "E501",    # handled by the formatter
  "S104",    # binding 0.0.0.0 is a deliberate, documented container default
  "B008",    # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S311"]
"scripts/*" = ["S101", "S603", "S607"]
"packages/sentinelx/firewall/*" = ["S603"]  # argv-list subprocess, audited in module
# Test fixtures need *reproducible* randomness, which is the opposite of what a
# CSPRNG provides. No value from this module is ever used as a secret.
"packages/sentinelx/testing/*" = ["S311"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["sentinelx"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
mypy_path = "packages"
packages = ["sentinelx"]
strict = true
warn_unreachable = true
disallow_any_generics = true
show_error_codes = true
plugins = ["pydantic.mypy"]
# Generated Alembic revisions: checked by `alembic check` and the PostgreSQL tests instead.
exclude = ["packages/sentinelx/storage/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["scapy.*", "sklearn.*", "redis.*", "psutil.*", "joblib.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
markers = [
  "integration: requires external services (postgres/redis)",
  "root: requires root privileges (live capture / firewall)",
  "slow: long-running benchmark or replay test",
]
filterwarnings = ["error::DeprecationWarning:sentinelx.*"]

[tool.coverage.run]
source = ["packages/sentinelx"]
omit = ["*/__main__.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
