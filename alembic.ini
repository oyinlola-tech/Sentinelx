# Alembic configuration for developers running `alembic` directly.
# The CLI (`sentinelx db upgrade`) configures Alembic programmatically instead.
# The database URL is read from DATABASE_URL via sentinelx settings; never put
# credentials in this file.
[alembic]
script_location = packages/sentinelx/storage/migrations
prepend_sys_path = packages
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
